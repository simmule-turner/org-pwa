# Actions are pinned to commit SHAs (the tag is in the comment). To upgrade one: look up the new tag's commit with
#   git ls-remote https://github.com/actions/NAME refs/tags/vN refs/tags/vN^{}
# (use the line ending in ^{} if there is one, else the plain line), then replace the SHA and the comment.
# Builds the native Android shell around the PWA: a release APK when a signing key is configured, otherwise a debug APK. Runs on demand (Actions -> native-android -> Run workflow),
# on a tag like native-v0.1.0, and whenever something under native/ changes. The APK is attached to the run as an artifact.
name: native-android

on:
  workflow_dispatch:
    inputs:
      allow_one_off:
        description: 'Build a debug APK with a one-off key if the signing secrets are missing (it cannot update an installed app)'
        type: boolean
        default: false
  push:
    tags: ['native-v*']
    paths: ['native/**', '.github/workflows/native-android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      # The generated Android project sets Java 21 (see native/android/app/capacitor.build.gradle).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            native/android/**/*.gradle*
            native/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install the shell's dependencies
        run: npm ci

      - name: Bundle the PWA and sync it into the Android project
        run: npm run sync

      - name: Show the toolchain (this is what to read first if the build fails)
        run: |
          node --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>/dev/null || echo "no Android platforms listed"

      # One stable key keeps a new build installable over the app already on the phone: Android refuses an update that is
      # signed with a different key. The key comes from four repository secrets (native/README.md says how to make them);
      # without them the build still works, with a one-off key.
      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ORGPWA_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ORGPWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORGPWA_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ORGPWA_KEY_PASSWORD }}
          ALLOW_ONE_OFF: ${{ inputs.allow_one_off }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ORGPWA_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ] || missing="$missing ORGPWA_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ORGPWA_KEY_ALIAS"
          [ -n "$KEY_PW" ] || missing="$missing ORGPWA_KEY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orgpwa.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/orgpwa.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error title=Signing key does not open::The keystore, its password or the alias is wrong. Check ORGPWA_KEYSTORE_BASE64, ORGPWA_KEYSTORE_PASSWORD and ORGPWA_KEY_ALIAS."
              exit 1
            fi
            echo "ORGPWA_KEYSTORE=$RUNNER_TEMP/orgpwa.keystore" >> "$GITHUB_ENV"
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_ONE_OFF" = "true" ]; then
            echo "::warning title=One-off key::Missing secrets:$missing. This debug APK cannot be installed over an earlier build."
            echo "mode=one-off" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Signing secrets missing::Missing repository secrets:$missing. They must be Repository secrets (Settings > Secrets and variables > Actions), not Environment secrets, and the names must match exactly. See native/README.md, Keeping your data across updates. To build a throwaway debug APK anyway, run the workflow by hand with allow_one_off ticked."
            exit 1
          fi

      # A release build needs the stable key (an unsigned release APK cannot be installed), so without the secrets the build is
      # a debug one, signed with Android's one-off debug key.
      - name: Build the APK
        id: build
        working-directory: native/android
        env:
          ORGPWA_KEYSTORE_PASSWORD: ${{ secrets.ORGPWA_KEYSTORE_PASSWORD }}
          ORGPWA_KEY_ALIAS: ${{ secrets.ORGPWA_KEY_ALIAS }}
          ORGPWA_KEY_PASSWORD: ${{ secrets.ORGPWA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.mode }}" = "stable" ]; then
            ./gradlew assembleRelease -x lintVitalRelease --no-daemon --stacktrace
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # The certificate's fingerprint is not secret. Two builds that show the same one can update each other.
      - name: Show which key signed the APK
        run: |
          apk=android/app/build/outputs/apk/${{ steps.build.outputs.variant }}/app-${{ steps.build.outputs.variant }}.apk
          apksigner=$(ls "${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          {
            echo "### Signing"
            echo "Key: ${{ steps.signing.outputs.mode }}"
            if [ -n "$apksigner" ]; then
              "$apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" | sed 's/^/    /'
            else
              echo "(apksigner was not found on this runner, so the fingerprint is not shown)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the APK after the shell and the web version it wraps
        id: apk
        run: |
          shell=$(node -p "JSON.parse(require('fs').readFileSync('www/native-shell.json','utf8')).shell")
          web=$(node -p "JSON.parse(require('fs').readFileSync('www/native-shell.json','utf8')).web")
          web="${web#org-pwa-shell-}"   # the web version is stored as org-pwa-shell-vNNN; the file name only needs vNNN
          suffix=""
          if [ "${{ steps.signing.outputs.mode }}" = "one-off" ]; then suffix="-one-off-key"; fi
          name="org-pwa-shell-${shell}-${web}-${{ steps.build.outputs.variant }}${suffix}.apk"
          cp android/app/build/outputs/apk/${{ steps.build.outputs.variant }}/app-${{ steps.build.outputs.variant }}.apk "$name"
          sha256sum "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: native/${{ steps.apk.outputs.name }}
          if-no-files-found: error
