# Runs on every push and pull request: the unit tests (fixed clock), the same tests in five time zones, the scope check,
# and the browser smoke test in headless Chromium.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils # xmllint, used by the ODT export test
      - run: npm install --no-save --no-package-lock eslint @eslint/js globals typescript
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:zones
      - run: npm install --prefix /tmp/acorn acorn eslint-scope
      - run: npm run check:scope

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke.mjs
