<!doctype html>
<meta charset="utf-8">
<!-- The page inside the hidden sandbox iframe for JavaScript source blocks and the init script (src-browser/babel-run.js).
     The iframe is sandbox="allow-scripts" (an opaque origin) and this policy gives it no network at all. The code to run is
     sent by the page in a message and starts in a Web Worker made from a blob, which inherits this policy. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:">
<script>
  (function () {
    function start(workerSource) {
      var worker;
      try {
        worker = new Worker(URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' })));
      } catch (e) {
        parent.postMessage({ type: 'fatal', message: String(e && e.message ? e.message : e) }, '*');
        return;
      }
      worker.onmessage = function (e) { parent.postMessage(e.data, '*'); };
      worker.onerror = function (e) { parent.postMessage({ type: 'fatal', message: e.message || 'worker error' }, '*'); };
      addEventListener('message', function (e) {
        if (e.source === parent) worker.postMessage(e.data);
      });
      parent.postMessage({ type: 'ready' }, '*');
    }
    // "Copy security diagnostics" (src-browser/security-diagnostics.js) asks what this page can reach. Only the app page can ask,
    // and nothing here is reachable from the worker: the worker's messages go to the app page, never to this handler.
    addEventListener('message', function probe(e) {
      if (e.source !== parent || !e.data || e.data.type !== 'probe') return;
      var typeofs = {};
      var names = String(e.data.names || '').split(',');
      for (var i = 0; i < names.length; i++) {
        try { typeofs[names[i]] = typeof window[names[i]]; } catch (err) { typeofs[names[i]] = 'error ' + (err && err.name); }
      }
      var extra = [];
      try {
        var all = Object.getOwnPropertyNames(window);
        for (var j = 0; j < all.length; j++) if (/capacitor|android|bridge|webview|native/i.test(all[j]) && names.indexOf(all[j]) < 0) extra.push(all[j]);
      } catch (err) { /* the list is only a bonus */ }
      var parentAccess;
      try { parentAccess = typeof parent.document; } catch (err) { parentAccess = 'blocked'; }
      if (parentAccess === 'undefined') parentAccess = 'blocked';
      parent.postMessage({ type: 'probe-page', nonce: e.data.nonce, probe: { typeofs: typeofs, extra: extra, parentAccess: parentAccess } }, '*');
    });
    addEventListener('message', function boot(e) {
      if (e.source !== parent || !e.data || e.data.type !== 'boot') return;
      removeEventListener('message', boot);
      start(String(e.data.source));
    });
    parent.postMessage({ type: 'hello' }, '*');
  })();
</script>
