<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>org-pwa</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --border: #8883;
    --border-strong: #8886;
    --surface: #8881;
    --muted: #8888;
    --accent: #185fa5;
    --todo-bg: #f0997b55;
    --todo-fg: #99341d;
    --done-bg: #97c45955;
    --done-fg: #27500a;
    --workflow-start-fg: #27500a;
    --workflow-terminal-fg: #a83232;
    --app-font-family: system-ui, sans-serif;
    --app-font-size: 16px;
    --app-font-size-tables: 13px;
    --reading-max-width: none;
  }
  html[data-theme="dark"] {
    --bg: #16181c;
    --fg: #e8e8e8;
    --border: #ffffff22;
    --border-strong: #ffffff3a;
    --surface: #ffffff14;
    --muted: #9aa0a6;
    --accent: #6fb2ff;
    --todo-bg: #ff8f5c40;
    --todo-fg: #ffb28c;
    --done-bg: #6fcf5740;
    --done-fg: #a3e693;
    --workflow-start-fg: #a3e693;
    --workflow-terminal-fg: #ff9999;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --border: #00000022;
    --border-strong: #0000003a;
    --surface: #00000009;
    --muted: #666666;
    --accent: #185fa5;
    --todo-bg: #f0997b55;
    --todo-fg: #99341d;
    --done-bg: #97c45955;
    --done-fg: #27500a;
    --workflow-start-fg: #27500a;
    --workflow-terminal-fg: #a83232;
  }
  /* Following System theme (no explicit data-theme) with an OS-level
     dark preference — the badge colors need the same dark-appropriate
     values as html[data-theme="dark"] above, since :root's own defaults
     are light-appropriate and don't auto-adjust for hardcoded hex colors
     the way "Canvas"/"CanvasText" do. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --todo-bg: #ff8f5c40;
      --todo-fg: #ffb28c;
      --done-bg: #6fcf5740;
      --done-fg: #a3e693;
      --workflow-start-fg: #a3e693;
      --workflow-terminal-fg: #ff9999;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    overflow: hidden; /* the page itself never scrolls or resizes — only #contentArea does, as its own designated scroll pane */
    overflow-x: hidden;
    width: 100%;
    height: 100vh; /* fallback for browsers without dvh support */
    height: 100dvh; /* the ACTUAL visible viewport height, correctly accounting for an on-screen keyboard or browser chrome — unlike vh, which mobile browsers keep pinned to the full keyboard-less screen height even while the keyboard is showing. That mismatch was the actual cause of "search changes the viewport size": vh-based max-heights kept computing against a screen that was momentarily larger than what was actually visible, so content overflowed past the visible bottom edge the moment the keyboard opened. */
  }
  body {
    font-family: var(--app-font-family);
    font-size: var(--app-font-size);
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  /* The top bar (header + File/View/Search panels) is truly fixed, not
     merely sticky — it should behave like real app chrome: it never
     scrolls away, full stop, regardless of how the content beneath it
     scrolls. max-height/overflow-y is a safety net for a
     very short viewport (e.g. landscape phone) with a long open panel —
     ordinarily the panel's own content (like search results) scrolls
     internally well before this would ever kick in. Settings is
     deliberately NOT part of this bar — it renders directly into
     #outline instead (same content area Text/Agenda view already use),
     completely replacing whatever was showing rather than overlaying it
     with a backdrop. That's a deliberate fix, not just a style choice: a
     backdrop-based modal left background elements still tab-focusable
     behind it, so focus could leak out of the "modal" into the outline,
     which then auto-scrolled into view — replacing the content outright
     means there's nothing else on the page to focus or scroll into.
     Since #topBar is now out of normal document flow, #contentArea's top
     margin is kept in sync with its actual rendered height in app.js
     (syncContentOffset). */
  #topBar {
    position: fixed; top: 0; left: 0;
    width: 100%; z-index: 5; background: var(--bg);
    max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex-wrap: nowrap; width: 100%; }
  #filename { flex: 1 1 auto; min-width: 0; font-size: 12px; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Uniform icon buttons — item 1: larger, icon-based, consistent touch
     target size (44px meets the standard mobile minimum) instead of
     variable-width text labels. */
  .icon-btn {
    flex-shrink: 0; width: 44px; height: 44px; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0;
    border-radius: 10px;
  }
  #contentArea { width: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

  #modelineBar {
    position: fixed; left: 0; bottom: 0;
    width: 100%; z-index: 52; background: var(--bg);
    border-top: 1px solid var(--border-strong);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Opt-in reading-width limit (see Settings → Appearance) -- applies in
     both the narrow (single-column) and wide (flex, alongside
     #sidePanel) layouts alike, since the underlying preference isn't
     itself tied to either. max-width:none (the default) is a no-op;
     margin:0 auto only has a visible effect once a real limit narrows
     the element below its own container's full width. */
  #outline { max-width: var(--reading-max-width); margin: 0 auto; }

  /* Wide-layout (desktop/laptop) mode: the whole reason this exists —
     see the comment on #sidePanel below for what actually goes in
     there. Everything above this query is completely untouched by it;
     below the breakpoint, #splitRow is just an inert wrapper div with
     no layout effect of its own, and #sidePanel stays hidden — the
     mobile experience is byte-for-byte the same DOM structure and CSS
     rules as before this feature existed, not a "mobile mode" of a
     unified responsive system that could subtly regress it. 900px was
     chosen as comfortably past typical phone/large-phablet widths in
     landscape, so an actual phone never crosses into this branch by
     accident. */
  @media (min-width: 900px) {
    /* #contentArea becomes a flex column so #status/#updateBanner/
       #externalChangeBanner keep their natural height and #splitRow
       gets exactly what's left — not "100% of #contentArea" (which
       would double-count the banner space and push content off the
       bottom of the screen), and not relying on #contentArea's own
       scroll (its overflow-y:auto above still applies as a harmless
       fallback, but shouldn't normally trigger, since #splitRow's own
       children scroll internally instead once this layout is active). */
    #contentArea { display: flex; flex-direction: column; }
    #splitRow { display: flex; align-items: stretch; flex: 1 1 auto; min-height: 0; }

    /* min-height/min-width: 0 on both flex children is load-bearing,
       not decoration — without it, a flex item defaults to
       min-height/width:auto, which means "at least as tall/wide as my
       content," permanently defeating overflow-y:auto no matter what
       else is set. This is the actual, well-known reason a flex-based
       scroll pane silently fails to scroll if you skip it. */
    #outline { flex: 1 1 auto; min-width: 0; overflow-y: auto; height: 100%; }

    /* #sidePanel is where Settings/Docs render on a wide screen instead
       of replacing #outline outright (see renderSettingsView/
       renderDocsView's own target-element parameter in app.js) — the
       actual point of this whole feature: on a phone there's no room
       to see your outline and your settings at once, so replacing the
       whole screen is the only option; on a 1200px monitor there's
       nothing stopping you from seeing both, so the extra width now
       gets used for something structural instead of just a wider
       column of empty margin. Hidden by default (display:none) —
       app.js's syncSidePanel() is what actually shows/populates it,
       exactly when there's something to show. */
    #sidePanel {
      flex: 0 0 420px;
      min-width: 0;
      overflow-y: auto;
      height: 100%;
      padding-left: 4px;
    }
    #sidePanelDivider {
      flex: 0 0 6px;
      cursor: col-resize;
      background: transparent;
      border-left: 1px solid var(--border);
      touch-action: none;
    }
    #sidePanelDivider:hover, #sidePanelDivider.dragging {
      background: var(--border-strong);
      border-left-color: transparent;
    }
  }

  #modeline {
    height: 24px; box-sizing: border-box; padding: 0 8px; background: #5f6368; border-bottom: 1px solid var(--border-strong);
    font-family: monospace; font-size: 11px; line-height: 1.4; color: #fff; opacity: 1;
    display: flex; align-items: center;
    white-space: nowrap; overflow-x: auto; overflow-y: hidden;
  }
  #minibuffer { height: 36px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; overflow: hidden; }
  #status {
    font-size: 13px;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 6px;
    max-height: 100%;
    overflow: hidden;
    transition: opacity 0.15s, background-color 0.15s;
  }
  #status.status--busy {
    opacity: 1;
    background: var(--surface);
    border-radius: 4px;
  }
  .status-spinner {
    width: 10px;
    height: 10px;
    border: 1.5px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    opacity: 0.7;
    flex-shrink: 0;
    animation: status-spin 0.7s linear infinite;
  }
  @keyframes status-spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .status-spinner { animation: none; }
  }
  .panel { border-bottom: 1px solid var(--border); background: var(--surface); padding: 10px 12px; font-size: 13px; width: 100%; box-sizing: border-box; }
  .popup-menu {
    position: fixed; z-index: 51; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg); box-shadow: 0 4px 16px #0006; padding: 6px; box-sizing: border-box;
    max-height: 70vh; overflow-y: auto;
  }
  /* Item 1.5: panel buttons (File/View menu options, Settings controls)
     larger and more touch-friendly than the previous compact text row. */
  .panel button { font-size: 15px; padding: 10px 14px; min-height: 44px; font-family: inherit; }
  .panel-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin: 8px 0; }
  /* Vertical dropdown menus (File/View/More, Export/backend-picker) --
     a bordered list of full-width, left-aligned rows, each its own
     tap target, divided by thin separator lines -- as opposed to
     .panel-row's horizontal row of individually-pill-shaped buttons,
     still used for every non-menu button row (toolbars, form fields,
     Save/Cancel pairs) elsewhere in this app. */
  .menu-list-item {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 12px 14px; min-height: 44px;
    box-sizing: border-box; background: var(--bg); color: var(--fg); border: none; border-radius: 0; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .menu-list-item:last-child { border-bottom: none; }
  /* Hover only on devices that genuinely support it (a mouse) -- on a
     touch device, :hover fires on tap with no reliable way to clear
     it again until something else is tapped, which would leave a
     stray highlight stuck on whatever was last touched. --surface is
     already theme-aware (its own separate light/dark/system-auto
     definitions), so this reads correctly in either theme with no
     extra work here. */
  @media (hover: hover) {
    .menu-list-item:hover { background: var(--surface); }
  }
  .menu-list-item:active { background: var(--border-strong); }
  .menu-list-item:disabled { opacity: 0.5; }
  .menu-list-item-disabled { opacity: 0.5; cursor: default; pointer-events: none; }
  /* The "small" menu-size setting (Settings -> Appearance -> Menu
     Size) -- applies to every popup menu at once via a single
     data-menu-size attribute on <html> (see app.js's own
     applyMenuSize), rather than each menu needing its own separate
     styling choice. "Regular" (the default; no attribute set at all)
     uses the sizing declared on .menu-list-item itself above. */
  html[data-menu-size="small"] .menu-list-item { font-size: 14px; padding: 9px 10px; min-height: 0; }
  .panel label { font-size: 12px; opacity: 0.75; display: block; margin-bottom: 2px; }
  .panel input[type="text"], .panel input[type="password"], .panel input[type="number"], .panel textarea {
    font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; min-height: 44px;
  }
  .panel-field { flex: 1 1 120px; min-width: 100px; }
  .panel-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; margin: 10px 0 4px; }
  .settings-section {
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 4px 12px 12px;
    margin-bottom: 14px; box-sizing: border-box; width: 100%;
  }
  .settings-section .panel-section-title { margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-bottom: 1px solid var(--border); font-family: var(--app-font-family); font-size: var(--app-font-size); }
  .fold-btn { width: 28px; height: 28px; font-size: 20px; line-height: 1; border: none; background: none; color: var(--fg); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .todo-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-right: 6px; cursor: pointer; flex-shrink: 0; }
  .todo-badge.todo { background: var(--todo-bg); color: var(--todo-fg); }
  .todo-badge.done { background: var(--done-bg); color: var(--done-fg); }
  .priority-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-right: 6px; cursor: pointer; flex-shrink: 0; border: 1px solid var(--accent); color: var(--accent); }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-strong); margin-left: 4px; opacity: 0.75; flex-shrink: 0; }
  .checkbox-row { padding-left: 32px; cursor: pointer; }
  .title-input { font: inherit; font-weight: 600; border: 1px solid #5a5; border-radius: 4px; padding: 1px 4px; flex: 1; min-width: 60px; background: var(--bg); color: var(--fg); }
  .heading-title { cursor: text; flex: 1 1 auto; min-width: 0; white-space: normal; overflow-wrap: anywhere; font-weight: 600; }
  .empty-state { padding: 40px 20px; text-align: center; opacity: 0.6; font-size: 14px; }
  button { background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 6px; }
  input, textarea { color: var(--fg); background: var(--bg); }
  /* Hard floor, not a suggestion: any focused input/textarea/select
     under 16px triggers iOS Safari's automatic zoom-on-focus, which
     visually "grows" the page and can leave it zoomed in — appearing to
     require horizontal scrolling — even after the field loses focus,
     since iOS doesn't reliably auto-revert. This overrides any smaller
     inline font-size a specific input/textarea/select might otherwise
     set (deliberately, via !important) — a single rule here is far more
     reliable than keeping every individual JS-set font-size at or above
     16px by memory across every input in the app, which is exactly how
     the search input's 14px got through uncaught before. */
  input, textarea, select { font-size: 16px !important; }

  /* Brief opacity increase on tap -- confirms the tap registered,
     since the button's own resting opacity is deliberately low. */
  #navBackBtn:active { opacity: 0.75; }
</style>
<!-- KaTeX -- LaTeX math fragment rendering (see src/math-render.js for
     the full architecture). Vendored locally, not loaded from a CDN,
     matching this app's own offline-first requirement; cached for
     offline use via sw.js's own SHELL_FILES list. A plain, non-module
     script tag specifically because KaTeX's own distributed bundle is
     UMD (attaches to window.katex in a browser context), not an ES
     module with its own export -- see math-render.js's own docs for
     why this, rather than a native import, is the correct integration
     here. -->
<link rel="stylesheet" href="src/vendor/katex/katex.min.css">
</head>
<body>
  <div id="topBar">
    <header>
      <button id="fileMenuBtn" class="icon-btn" aria-label="File">&#128193;</button>
      <span id="filename">No file open</span>
      <button id="viewMenuBtn" class="icon-btn" disabled aria-label="View">&#128065;</button>
      <button id="moreBtn" class="icon-btn" disabled aria-label="More">&#8942;</button>
    </header>
    <div id="searchPanel" class="panel" style="display: none;"></div>
    <div id="capturePanel" class="panel" style="display: none;"></div>
    <div id="historyPanel" class="panel" style="display: none;"></div>
    <div id="doneNotePanel" class="panel" style="display: none;"></div>
    <div id="refilePanel" class="panel" style="display: none;"></div>
    <!-- Kept in the DOM so their existing click handlers and disabled-state
         logic stay completely untouched -- the More panel's own buttons
         just call .click() on these rather than duplicating any logic. -->
    <button id="searchBtn" disabled aria-label="Search" style="display: none;">&#128269;</button>
    <button id="captureBtn" disabled aria-label="Capture" style="display: none;">&#128229;</button>
    <button id="addBtn" disabled aria-label="Add heading" style="display: none;">+</button>
    <button id="settingsBtn" aria-label="Settings" style="display: none;">&#9881;</button>
  </div>
  <div
    id="fileMenuPanel"
    class="popup-menu"
    style="display: none;"
  ></div>
  <div
    id="viewMenuPanel"
    class="popup-menu"
    style="display: none;"
  ></div>
  <div
    id="morePanel"
    class="popup-menu"
    style="display: none;"
  ></div>
  <button
    id="navBackBtn"
    aria-label="Go back to previous location"
    style="
      display: none;
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--fg);
      opacity: 0.35;
      color: var(--bg);
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 2px 8px #0004;
      cursor: pointer;
    "
  ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a5 5 0 0 1 5 5v3"/></svg></button>
  <button
    id="extraMenuBtn"
    aria-label="Extras menu"
    style="
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--fg);
      opacity: 0.35;
      color: var(--bg);
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 2px 8px #0004;
      cursor: pointer;
    "
  >&#9776;</button>
  <div
    id="extraMenuPanel"
    class="popup-menu"
    style="display: none;"
  ></div>
  <div id="contentArea">
    <div id="updateBanner" style="display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: #185fa5; color: white; font-size: 13px;">
      <span>A new version is available.</span>
      <button id="updateReloadBtn" style="background: white; color: #185fa5; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: 600;">Reload</button>
    </div>
    <div id="externalChangeBanner" style="display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: #a86a00; color: white; font-size: 13px;">
      <span id="externalChangeText">This file changed elsewhere since you opened it here.</span>
      <span style="display: flex; gap: 6px; flex-shrink: 0;">
        <button id="externalChangeReloadBtn" style="background: white; color: #a86a00; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: 600;">Reload</button>
        <button id="externalChangeDismissBtn" style="background: transparent; color: white; border: 1px solid white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: 600;">Dismiss</button>
      </span>
    </div>
    <div id="splitRow">
      <div id="outline"></div>
      <div id="sidePanelDivider" style="display: none;"></div>
      <div id="sidePanel" style="display: none;"></div>
    </div>
  </div>
  <div id="modelineBar">
    <div id="modeline"></div>
    <div id="minibuffer">
      <div id="status"></div>
      <div id="minibufferSearch" style="display: none;"></div>
    </div>
  </div>
  <script src="src/vendor/katex/katex.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
